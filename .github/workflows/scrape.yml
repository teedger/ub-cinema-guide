name: Scrape cinemas and publish

on:
  schedule:
    # 05:00 Ulaanbaatar time (UTC+8), once a day (21:00 UTC the previous day)
    - cron: "0 21 * * *"
  # Manual run from the Actions tab (use after pushing code changes)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Ulaanbaatar
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape all cinemas
        # Plain HTTP against the cinema sites: no browser needed.
        run: python scraper_ultimate.py

      - name: Fetch the worldwide box office top 10
        # Optional extra: if Box Office Mojo is down the site still publishes, just without the Top 10 row.
        continue-on-error: true
        run: python boxoffice.py

      - name: Build the static site
        run: python build_static.py

      - name: Keep the raw data for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-output
          path: output/
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
